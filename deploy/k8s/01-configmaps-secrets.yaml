apiVersion: v1
kind: ConfigMap
metadata:
  name: unimind-config
  namespace: unimind-aegisops
data:
  ENVIRONMENT: "production"
  DATABASE_BACKEND: "postgres"
  VECTOR_BACKEND: "chroma"
  CACHE_BACKEND: "redis"
  STORAGE_BACKEND: "minio"
  LOG_LEVEL: "INFO"
  AUTH_ENFORCE_STRICT: "true"
  DEFAULT_STORAGE_QUOTA_MB: "100"
  DEFAULT_RATE_LIMIT_PER_MIN: "120"
  DEFAULT_TOKEN_BUDGET: "1000000"
  MINIO_ENDPOINT: "unimind-minio:9000"
  MINIO_BUCKET: "unimind-documents"
  REDIS_HOST: "unimind-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: unimind-secrets
  namespace: unimind-aegisops
type: Opaque
stringData:
  SECRET_KEY: "prod-unimind-master-jwt-cryptographic-secret-2026-enterprise-grade"
  DATABASE_URL: "postgresql://unimind_prod_user:SecurePostgresPassword2026@unimind-postgres:5432/unimind_enterprise"
  REDIS_PASSWORD: "ProdRedisSecurePassword2026"
  MINIO_ROOT_USER: "unimind_minio_admin"
  MINIO_ROOT_PASSWORD: "ProdMinioMasterStorageSecret2026"
