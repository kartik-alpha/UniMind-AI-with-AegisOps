apiVersion: apps/v1
kind: Deployment
metadata:
  name: unimind-backend
  namespace: unimind-aegisops
  labels:
    app: unimind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unimind-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: unimind-backend
    spec:
      containers:
        - name: backend
          image: unimind/backend:v2.0-enterprise
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: unimind-config
            - secretRef:
                name: unimind-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/aegisops/services
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: unimind-backend
  namespace: unimind-aegisops
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: unimind-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unimind-backend-hpa
  namespace: unimind-aegisops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unimind-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
