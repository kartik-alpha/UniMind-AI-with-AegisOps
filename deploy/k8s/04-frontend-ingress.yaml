apiVersion: apps/v1
kind: Deployment
metadata:
  name: unimind-frontend
  namespace: unimind-aegisops
  labels:
    app: unimind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unimind-frontend
  template:
    metadata:
      labels:
        app: unimind-frontend
    spec:
      containers:
        - name: frontend
          image: unimind/frontend:v2.0-enterprise
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: unimind-frontend
  namespace: unimind-aegisops
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: unimind-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unimind-ingress
  namespace: unimind-aegisops
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.unimind.ai
      secretName: unimind-tls-cert
  rules:
    - host: app.unimind.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: unimind-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unimind-frontend
                port:
                  number: 80
