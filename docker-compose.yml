version: '3.8'

# Hardware-Optimized Hybrid Distributed Infrastructure
# Profile-based execution prevents simultaneous memory exhaustion on 8 GB host

services:
  # Profile: postgres (Stage H2)
  postgres:
    profiles: ["postgres", "integration"]
    image: postgres:15-alpine
    container_name: unimind-postgres
    environment:
      POSTGRES_DB: unimind_db
      POSTGRES_USER: unimind_user
      POSTGRES_PASSWORD: unimind_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 350M

  # Profile: qdrant (Stage H3)
  qdrant:
    profiles: ["qdrant", "integration"]
    image: qdrant/qdrant:v1.7.4
    container_name: unimind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 450M

  # Profile: redis (Stage H4)
  redis:
    profiles: ["redis", "integration"]
    image: redis:7-alpine
    container_name: unimind-redis
    command: redis-server --maxmemory 90mb --maxmemory-policy allkeys-lru --requirepass unimind_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 100M

  # Profile: minio (Stage H5)
  minio:
    profiles: ["minio", "integration"]
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: unimind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 150M

  # Profile: app (FastAPI Monolith + React Frontend)
  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unimind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_BACKEND=sqlite
      - DATABASE_URL=sqlite:///./unimind.db
      - VECTOR_BACKEND=chroma
      - CACHE_BACKEND=memory
      - STORAGE_BACKEND=local
      - SECRET_KEY=unimind-super-secret-key-change-in-production-2026
    deploy:
      resources:
        limits:
          memory: 450M

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unimind-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 250M

  # Profile: services (Fleet Microservices)
  lms:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/lms/Dockerfile
    container_name: unimind-lms
    ports:
      - "8001:8001"

  student-portal:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/student_portal/Dockerfile
    container_name: unimind-student-portal
    ports:
      - "8002:8002"

  exam-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/exam_service/Dockerfile
    container_name: unimind-exam-service
    ports:
      - "8003:8003"

  library-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/library_service/Dockerfile
    container_name: unimind-library-service
    ports:
      - "8004:8004"

  # Profile: monitoring
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.45.0
    container_name: unimind-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:2.9.0
    container_name: unimind-loki
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.2.0
    container_name: unimind-grafana
    ports:
      - "3001:3000"

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  minio_data:
