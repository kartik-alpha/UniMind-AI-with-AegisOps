apiVersion: v1
kind: Service
metadata:
  name: {{ include "unimind.fullname" . }}-frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "unimind.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: {{ include "unimind.name" . }}
