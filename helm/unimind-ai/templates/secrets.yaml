apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unimind.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "unimind.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | default "PLACEHOLDER_REPLACE_WITH_VAULT_IN_PROD" | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | default "" | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | default "" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | default "" | quote }}
