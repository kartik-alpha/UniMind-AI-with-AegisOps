# Multi-Node Production High-Availability Overrides
global:
  env: production
  logLevel: WARN

backends:
  database: postgres
  vector: qdrant
  cache: redis
  storage: s3

config:
  databaseUrl: "postgresql://unimind_app@patroni-cluster.postgres.svc.cluster.local:5432/unimind_production?sslmode=verify-full"
  qdrantHost: "qdrant-cluster.qdrant.svc.cluster.local"
  qdrantPort: 6333
  redisUrl: "redis-sentinel://sentinel.redis.svc.cluster.local:26379/0?master=mymaster"
  s3EndpointUrl: "https://s3.us-east-1.amazonaws.com"
  s3BucketName: "unimind-production-documents-us-east-1"
  s3RegionName: "us-east-1"

backend:
  replicaCount: 4
  resources:
    limits:
      cpu: "2000m"
      memory: "750Mi"
    requests:
      cpu: "500m"
      memory: "400Mi"

frontend:
  replicaCount: 3
  resources:
    limits:
      cpu: "1000m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

ingress:
  enabled: true
  className: nginx
  host: app.unimind.edu
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

hpa:
  enabled: true
  minReplicas: 4
  maxReplicas: 16
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

persistence:
  enabled: false # In production, storage is managed by S3 / object store
