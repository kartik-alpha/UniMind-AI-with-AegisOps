apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-service
  namespace: unimind-aegisops
  labels:
    app: exam-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exam-service
  template:
    metadata:
      labels:
        app: exam-service
    spec:
      containers:
      - name: exam-service
        image: unimind/exam-service:latest
        ports:
        - containerPort: 8003
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-service
  namespace: unimind-aegisops
  labels:
    app: lms-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lms-service
  template:
    metadata:
      labels:
        app: lms-service
    spec:
      containers:
      - name: lms-service
        image: unimind/lms-service:latest
        ports:
        - containerPort: 8001
