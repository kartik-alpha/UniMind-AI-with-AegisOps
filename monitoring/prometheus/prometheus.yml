global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'unimind-backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'lms-service'
    static_configs:
      - targets: ['lms:8001']

  - job_name: 'student-portal-service'
    static_configs:
      - targets: ['student-portal:8002']

  - job_name: 'exam-service'
    static_configs:
      - targets: ['exam-service:8003']

  - job_name: 'library-service'
    static_configs:
      - targets: ['library-service:8004']
